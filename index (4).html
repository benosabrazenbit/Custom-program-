
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TindahanPro - Inventory Management</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<header>
    <h1>TindahanPro</h1>
    <p>Inventory Management System</p>
</header>

<nav>
    <button onclick="showSection('dashboard')">Dashboard</button>
    <button onclick="showSection('inventory')">Inventory</button>
</nav>

<main>

    <!-- DASHBOARD -->
    <section id="dashboard" class="section active">
        <h2>Inventory Dashboard</h2>

        <div class="dashboard">
            <div class="card">
                <h3>Total Products</h3>
                <p id="totalProducts">0</p>
            </div>

            <div class="card">
                <h3>Total Stock</h3>
                <p id="totalStock">0</p>
            </div>

            <div class="card">
                <h3>Inventory Value</h3>
                <p id="inventoryValue">₱0.00</p>
            </div>

            <div class="card">
                <h3>Low Stock Items</h3>
                <p id="lowStockCount">0</p>
            </div>
        </div>

        <div class="panel">
            <h3>Low Stock Notifications</h3>
            <div id="lowStockList"></div>
        </div>
    </section>

    <!-- INVENTORY -->
    <section id="inventory" class="section">
        <h2>Product Inventory</h2>

        <div class="panel">
            <h3>Add Product</h3>

            <form id="productForm">
                <input type="hidden" id="productId">

                <label for="productName">Product Name</label>
                <input type="text" id="productName"
                    placeholder="Enter product name" required>

                <label for="productCategory">Category</label>
                <input type="text" id="productCategory"
                    placeholder="Example: Food, Drinks" required>

                <label for="productPrice">Price (₱)</label>
                <input type="number" id="productPrice"
                    placeholder="Enter price" min="0.01"
                    step="0.01" required>

                <label for="productStock">Stock Quantity</label>
                <input type="number" id="productStock"
                    placeholder="Enter quantity" min="0"
                    step="1" required>

                <button type="submit" id="saveButton">
                    Add Product
                </button>

                <button type="button" class="cancel"
                    id="cancelButton" hidden>
                    Cancel Edit
                </button>
            </form>

            <p id="message"></p>
        </div>

        <div class="panel">
            <h3>Product List</h3>

            <input type="search" id="searchProduct"
                placeholder="Search products...">

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Stock Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="productTable"></tbody>
                </table>
            </div>

            <button id="exportButton">Export Inventory CSV</button>
        </div>
    </section>

</main>

<footer>
    <p>© <span id="year"></span> TindahanPro Inventory System</p>
</footer>

</body>
</html>
